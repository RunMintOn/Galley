<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galley</title><link rel="stylesheet" href="/style.css"></head>
<body class="booting">
<svg id="sprite" aria-hidden="true">
  <symbol id="i-more" viewBox="0 0 16 16">
    <circle cx="3.4" cy="8" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="8" cy="8" r="1.15" fill="currentColor" stroke="none"/>
    <circle cx="12.6" cy="8" r="1.15" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2"/></symbol>
  <symbol id="i-panel-left" viewBox="0 0 16 16">
    <rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1.4"/>
    <path d="M6.2 3.2v9.6"/><path d="M11.2 6.2 9.2 8l2 1.8"/>
  </symbol>
  <symbol id="i-sliders" viewBox="0 0 16 16">
    <path d="M2.6 5.2h10.8M2.6 10.8h10.8"/>
    <circle cx="6.1" cy="5.2" r="1.5"/><circle cx="9.9" cy="10.8" r="1.5"/>
  </symbol>
  <symbol id="i-external" viewBox="0 0 16 16">
    <path d="M9.6 2.8h3.7v3.7"/><path d="M13.3 2.8 7.7 8.4"/>
    <path d="M11.7 9.4v2.3a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5V5.6A1.5 1.5 0 0 1 4 4.1h2.4"/>
  </symbol>
  <symbol id="i-code" viewBox="0 0 16 16"><path d="m5.6 4.6-3.2 3.4 3.2 3.4M10.4 4.6l3.2 3.4-3.2 3.4"/></symbol>
  <symbol id="i-file" viewBox="0 0 16 16">
    <path d="M4.2 1.9h4.9l3.7 3.7v8.5H4.2Z"/><path d="M9.1 1.9v3.7h3.7"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4V3.5a1 1 0 0 1 1-1h3l1.5 1.7H13a1 1 0 0 1 1 1v6.3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z"/></symbol>
  <symbol id="i-folder-open" viewBox="0 0 16 16"><path d="M2 10V3.5a1 1 0 0 1 1-1h3l1.5 1.7H12a1 1 0 0 1 1 1v1.2"/><path d="M4 6.4h10l-1.4 6.1H2Z" fill="currentColor" fill-opacity=".15"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m6.2 3.8 4.2 4.2-4.2 4.2"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 16 16"><path d="m3.8 6.2 4.2 4.2 4.2-4.2"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m4.6 4.6 6.8 6.8M11.4 4.6l-6.8 6.8"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="6.8" cy="6.8" r="4"/><path d="m9.8 9.8 3.4 3.4"/></symbol>
  <symbol id="i-target" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M3 3h10M3 13h10m2-7 3-2 3 2m-6 4 3 2 3-2"/></symbol>
  <symbol id="i-new-file" viewBox="0 0 16 16"><path d="M8 14H3V2h6l3 3v3M9 2v3h3M12 10v5M9.5 12.5h5"/></symbol>
  <symbol id="i-new-folder" viewBox="0 0 16 16"><path d="M7 12H2V3h4l2 2h6v3M11.5 9v6M8.5 12h6"/></symbol>
</svg>
<div id="boot-panel"><p id="boot-message">Opening Galley…</p><button id="retry" hidden>Retry</button></div>
<div id="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="notice-undo" hidden>Undo</button><button id="notice-close" class="icon-btn" aria-label="Dismiss notification"><svg class="icon"><use href="#i-close"/></svg></button></div>
<div id="project-context" class="menu-items" hidden><button id="context-reveal-project">Reveal in Finder</button><button id="context-terminal-project">Open in Terminal</button><hr><button id="context-move-project">Move up</button><button id="context-remove-project">Remove project</button></div>
<div id="file-context" class="menu-items" role="menu" aria-label="File actions" hidden></div>
<dialog id="file-picker" aria-label="Go to file">
  <div class="file-picker-input"><svg class="icon"><use href="#i-search"/></svg><input id="file-query" type="text" placeholder="Go to file…" aria-label="Find a file by name or path" role="combobox" aria-controls="file-results" aria-expanded="true" aria-autocomplete="list" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
  <div id="file-results" role="listbox" aria-label="Matching files"></div><p id="file-search-status" role="status"></p>
</dialog>
<main id="console">
  <section class="pane projects-pane" id="projects-pane">
    <div class="resizer" data-edge="projects" role="separator" aria-orientation="vertical" aria-controls="projects-pane files-pane" aria-valuenow="210" aria-valuemin="140" aria-valuemax="360" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <header class="pane-heading"><strong>PROJECTS <span id="project-count"></span></strong><button id="add-project" class="icon-btn" aria-label="Add folder" title="Add folder"><svg class="icon"><use href="#i-plus"/></svg></button><button class="pane-toggle" data-collapse="projects-pane" aria-label="Collapse projects pane" title="Collapse projects pane"></button></header>
    <button class="rail-button" data-collapse="projects-pane" aria-label="Expand projects pane" title="Expand projects pane"></button>
    <div class="pane-body"><nav id="projects" aria-label="Projects"></nav></div>
    <footer id="watch-state"><span class="watch-dot" aria-hidden="true"></span><span id="watch-text">Local files</span></footer>
  </section>
  <section class="pane files-pane" id="files-pane">
    <div class="resizer" data-edge="files" role="separator" aria-orientation="vertical" aria-controls="files-pane content-pane" aria-valuenow="248" aria-valuemin="180" aria-valuemax="420" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <header class="pane-heading"><strong id="index-label">CHANGED <span id="file-count">0</span></strong><button id="changed-layout" class="text-toggle" aria-pressed="false" aria-label="Show changed files as a tree" title="Show changed files as a tree">Tree</button><span id="change-totals" class="totals"></span><button class="pane-toggle" data-collapse="files-pane" aria-label="Collapse files pane" title="Collapse files pane"></button></header>
    <button class="rail-button" data-collapse="files-pane" aria-label="Expand files pane" title="Expand files pane"></button>
    <div class="pane-body" id="review-index"><nav id="changed" aria-label="Changed files"></nav><div class="tree-heading"><strong>FILES</strong><span class="spacer"></span><button id="new-file" class="icon-btn" aria-label="New file" title="New file"><svg class="icon"><use href="#i-new-file"/></svg></button><button id="new-folder" class="icon-btn" aria-label="New folder" title="New folder"><svg class="icon"><use href="#i-new-folder"/></svg></button><button id="find-file" class="icon-btn" aria-label="Find file" title="Go to file (⌘P)"><svg class="icon"><use href="#i-search"/></svg></button><button id="reveal-file" class="icon-btn" aria-label="Reveal current file" title="Reveal current file"><svg class="icon"><use href="#i-target"/></svg></button><button id="collapse-tree" class="icon-btn" aria-label="Collapse all folders" title="Collapse all folders"><svg class="icon"><use href="#i-collapse"/></svg></button></div><nav id="tree" aria-label="Files" tabindex="0"></nav></div>
    <div class="pane-body" id="git-index" hidden></div>
    <footer class="files-footer"><button id="open-scratch">Markdown editor<svg class="icon"><use href="#i-external"/></svg></button></footer>
  </section>
  <section class="pane content-pane" id="content-pane">
    <header class="content-header"><nav class="segmented" aria-label="Content view"><button id="turn-tab" aria-pressed="true">Review</button><button id="history-tab" aria-pressed="false">Git</button></nav><span id="content-name" class="doc-name"></span><span id="content-counts" class="totals"></span><span class="spacer"></span><button class="pane-toggle" data-collapse="content-pane" aria-label="Collapse content pane" title="Collapse content pane"></button></header>
    <button class="rail-button" data-collapse="content-pane" aria-label="Expand content pane" title="Expand content pane"></button>
    <div id="doc-toolbar" class="doc-toolbar" hidden></div>
    <div id="source-toolbar" class="doc-toolbar" hidden><span class="toolbar-note">Temporary preview · not written to disk</span><span class="spacer"></span><button id="close-source" class="icon-btn" aria-label="Close source" title="Return to file or diff"><svg class="icon"><use href="#i-close"/></svg></button></div>
    <div class="pane-body" id="content"><p class="empty">Select a project and round</p></div>
    <footer><span id="content-position"></span><div id="content-footer-actions"></div></footer>
    <div id="source-view" class="pane-body source-view" hidden><textarea id="reply-source" aria-label="Reply source (temporary preview)" spellcheck="false"></textarea></div>
  </section>
  <section class="pane reply-pane" id="reply-pane">
    <div class="resizer" data-edge="reply" role="separator" aria-orientation="vertical" aria-controls="content-pane reply-pane" aria-valuenow="470" aria-valuemin="300" aria-valuemax="900" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <header class="pane-heading reply-header">
      <div id="progress" aria-hidden="true"><i></i></div>
      <strong class="pane-title">Reply</strong>
      <span id="reply-title" class="reply-context"></span>
      <div class="head-actions">
        <details class="menu settings" id="settings-menu">
          <summary class="icon-btn" aria-label="View settings" title="View settings"><svg class="icon"><use href="#i-sliders"/></svg></summary>
          <div class="menu-items popover">
            <div class="pop-head">View settings</div>
            <div class="setting"><div class="label">THEME</div><div class="segmented block" data-setting="theme"><button data-value="dark">Dark</button><button data-value="light">Light</button></div></div>
            <div class="setting"><div class="label">PAPER</div><div class="segmented block" data-setting="paper"><button data-value="charcoal">Charcoal</button><button data-value="ivory">Ivory</button></div></div>
            <div class="setting"><div class="label">PROSE</div><div class="segmented block" data-setting="font"><button data-value="system">System</button><button data-value="serif">Serif</button><button data-value="mono">Mono</button></div></div>
            <label class="check"><input type="checkbox" id="default-preview"><span class="box"></span>Open Markdown in preview</label>
            <div class="pop-foot">Applies to both windows.</div>
          </div>
        </details>
        <button class="pane-toggle" data-collapse="reply-pane" aria-label="Collapse reply pane" title="Collapse reply pane"></button>
      </div>
    </header>
    <button class="rail-button" data-collapse="reply-pane" aria-label="Expand reply pane" title="Expand reply pane"></button>
    <div class="reply-navigation" aria-label="Reply navigation">
      <span class="pick session-pick"><select id="sessions" aria-label="Session"></select></span>
      <div class="reply-pagination"><button id="previous" class="icon-btn" aria-label="Previous round" title="Previous round (←)"><svg class="icon flip"><use href="#i-chevron"/></svg></button><span class="pick round-pick"><select id="rounds" aria-label="Round"></select></span><button id="next" class="icon-btn" aria-label="Next round" title="Next round (→)"><svg class="icon"><use href="#i-chevron"/></svg></button></div>
      <button id="latest" hidden>Back to latest</button>
      <span id="reading-state"></span>
      <span id="session-connection"><i aria-hidden="true"></i><span id="session-state"></span></span>
      <span class="spacer"></span>
      <button id="show-source" class="icon-btn" aria-pressed="false" aria-controls="source-view" aria-label="Reply source" title="Reply source (⌘↵)"><svg class="icon"><use href="#i-code"/></svg></button>
      <button id="toggle-input" class="btn-quiet" aria-controls="message-panel" aria-expanded="false">Reply</button>
    </div>
    <div class="canvas"><article class="sheet markdown-body" id="document"></article></div>
    <section id="message-panel" aria-label="Send to the current pi session" hidden><div id="input-area"><textarea id="message-input" rows="2" aria-label="Message the current session" placeholder="Continue the conversation…" spellcheck="false"></textarea><div class="message-caption"><span id="send-state" role="status"></span><span>Enter to send · Shift+Enter for a new line</span><button id="send">Send</button></div></div></section>
  </section>
</main>
<script type="module" src="/bootstrap.js"></script>
</body>
</html>
