<!doctype html>
<html lang="zh-CN" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Console</title><link rel="stylesheet" href="/style.css"></head>
<body class="booting">
<div id="boot-panel"><p id="boot-message">正在打开审查台…</p><button id="retry" hidden>重试</button></div>
<div id="notice" role="status" aria-live="polite"></div>
<main id="console">
  <section class="pane projects-pane" id="projects-pane">
    <header class="pane-heading"><strong>PROJECTS <span id="project-count"></span></strong><details class="menu" id="project-menu"><summary aria-label="项目操作" title="项目操作">⋯</summary><div class="menu-items"><button id="move-project">当前项前移</button><button id="remove-project">移除当前项目</button><button data-collapse="projects-pane">收起项目栏</button></div></details><button id="add-project-top" aria-label="添加目录" title="添加目录">＋</button></header>
    <button class="rail-button" data-collapse="projects-pane" aria-label="展开项目栏" title="项目">▦</button>
    <div class="pane-body"><nav id="projects" aria-label="项目"></nav><button id="add-project"><span>＋ Add folder</span><kbd>⌘O</kbd></button></div>
    <footer id="watch-state">本地文件</footer>
  </section>
  <section class="pane files-pane" id="files-pane">
    <header class="pane-heading"><strong id="index-label">CHANGED <span id="file-count">0</span></strong><span id="change-totals" class="totals"></span><button data-collapse="files-pane" aria-label="折叠文件" title="收起文件树">‹</button></header>
    <div class="rail-controls"><button data-collapse="files-pane" aria-label="展开文件树" title="文件树">▱</button><button data-collapse="content-pane" aria-label="展开内容" title="文件与改动">☰</button><span id="rail-count"></span></div>
    <div class="pane-body" id="review-index"><div class="index-options"><span id="round-time"></span><button id="changed-layout" aria-pressed="false">Tree</button></div><nav id="changed" aria-label="本轮改动文件"></nav><h3 class="tree-heading">FILES</h3><nav id="tree" aria-label="文件树"></nav></div>
    <div class="pane-body" id="git-index" hidden></div>
    <footer><button id="open-scratch">临时文档 ↗</button></footer>
  </section>
  <section class="pane content-pane" id="content-pane">
    <header class="content-header"><nav class="segmented"><button id="turn-tab" aria-pressed="true">Review</button><button id="history-tab" aria-pressed="false">Git</button></nav><span id="content-name"></span><span id="content-counts" class="totals"></span><div id="content-meta"></div><div id="content-actions"></div><button data-collapse="content-pane" aria-label="折叠内容" title="专注回复">‹</button></header>
    <div class="pane-body" id="content"><p class="empty">请选择项目和轮次</p></div>
    <footer><span id="content-position"></span><div id="content-footer-actions"></div></footer>
    <header id="source-header" hidden><span>Markdown source</span><button id="close-source" aria-label="关闭回复原文" title="返回文件或改动">×</button></header>
    <div id="source-view" class="pane-body" hidden><textarea id="reply-source" aria-label="回复源码（临时预览）" spellcheck="false"></textarea></div>
    <footer id="source-footer" hidden>临时预览 · 不写入文件或会话</footer>
  </section>
  <section class="pane reply-pane" id="reply-pane">
    <header class="reply-header"><div id="progress" aria-hidden="true"><i></i></div><div class="brand"><strong>Visual Reply</strong><span id="reply-title">Text-native visual replies for Pi</span></div><nav aria-label="回复操作"><button id="show-source" aria-controls="source-view" aria-expanded="false" title="回复原文（⌘/Ctrl + Enter）">Show source</button><kbd>⌘↵</kbd><button id="theme" aria-label="切换深浅主题" title="切换深浅主题"></button><select id="paper" aria-label="Paper colour" title="Paper colour"></select><button data-collapse="reply-pane" aria-label="折叠回复" title="专注改动">›</button></nav></header>
    <div class="reply-navigation" aria-label="回复导航"><select id="sessions" aria-label="会话"></select><div class="reply-pagination"><button id="previous" aria-label="上一轮" title="上一轮（←）">‹</button><select id="rounds" aria-label="轮次"></select><button id="next" aria-label="下一轮" title="下一轮（→）">›</button></div><span id="reading-state">Latest reply</span><button id="latest" hidden>Back to latest</button><span id="session-connection"><i aria-hidden="true"></i><span id="session-state"></span></span><button id="toggle-input" aria-controls="message-panel" aria-expanded="false">Input</button></div>
    <div class="canvas"><article class="sheet markdown-body" id="document"></article></div>
    <section id="message-panel" aria-label="发送到当前 pi 会话" hidden><div id="input-area"><textarea id="message-input" rows="2" aria-label="发送到当前活会话" placeholder="Continue the conversation…" spellcheck="false"></textarea><div class="message-caption"><span id="send-state" role="status"></span><span>Enter to send · Shift+Enter for a new line</span><button id="send">Send ↵</button></div></div></section>
  </section>
</main>
<script type="module" src="/bootstrap.js"></script>
</body>
</html>
